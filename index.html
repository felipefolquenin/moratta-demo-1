      input, select, textarea { width:100%; padding:9px 12px; border:1px solid ${LINHA}; border-radius:8px;
        font-size:13.5px; font-family:inherit; color:${TINTA}; background:${BRANCO}; outline:none;
        transition:border-color .15s, box-shadow .15s; }
      input:focus, select:focus, textarea:focus { border-color:${TEAL}; box-shadow:0 0 0 3px ${TEAL}1F; }
      input::placeholder, textarea::placeholder { color:#A9B8BE; }
      textarea { resize:vertical; }
      .duas-colunas { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .barra-acoes { display:flex; align-items:center; justify-content:space-between; gap:14px;
        margin-bottom:18px; flex-wrap:wrap; }
      .filtros { display:flex; gap:10px; flex-wrap:wrap; }
      .aviso { background:${TEAL_FUNDO}; border:1px solid ${TEAL}33; color:${TEXTO}; font-size:12.5px;
        padding:11px 13px; border-radius:8px; margin-bottom:18px; line-height:1.5; }

      /* ----- Seletor com busca ----- */
      .sel-botao { width:100%; display:flex; align-items:center; justify-content:space-between;
        padding:9px 12px; border:1px solid ${LINHA}; border-radius:8px; font-size:13.5px;
        background:${BRANCO}; color:${TINTA}; cursor:pointer; text-align:left; font-family:inherit; }
      .sel-botao:hover { border-color:#CBD6DA; }
      .sel-lista { position:absolute; z-index:60; top:calc(100% + 5px); left:0; right:0; background:${BRANCO};
        border:1px solid ${LINHA}; border-radius:9px; box-shadow:0 10px 28px rgba(22,40,47,.12); overflow:hidden; }
      .sel-busca { border:none !important; border-bottom:1px solid ${LINHA} !important; border-radius:0 !important; }
      .sel-busca:focus { box-shadow:none !important; }
      .sel-item { display:block; width:100%; text-align:left; border:none; background:transparent;
        color:${TEXTO}; padding:9px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
      .sel-item:hover { background:${FUNDO}; }
      .sel-item.ativo { background:${TEAL_FUNDO}; color:${TEAL}; font-weight:600; }

      /* ----- Modal ----- */
      .fundo-modal { position:fixed; inset:0; background:rgba(22,40,47,.35); display:grid;
        place-items:center; padding:20px; z-index:80; }
      .caixa-modal { background:${BRANCO}; border-radius:12px; max-width:100%; max-height:92vh;
        display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(22,40,47,.2); }
      .topo-modal { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
        padding:20px 22px 16px; border-bottom:1px solid ${LINHA}; }
      .corpo-modal { padding:20px 22px 22px; overflow-y:auto; }
      .fechar { background:none; border:none; color:${SUAVE}; font-size:15px; cursor:pointer;
        padding:2px 6px; border-radius:6px; line-height:1; }
      .fechar:hover { background:${FUNDO}; color:${TINTA}; }

      /* ----- Condomínios ----- */
      .grade-cartoes { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
      .cartao-cond { background:${BRANCO}; border:1px solid ${LINHA}; border-radius:10px; padding:17px 18px;
        text-align:left; cursor:pointer; font-family:inherit; transition:border-color .15s, box-shadow .15s; }
      .cartao-cond:hover { border-color:${TEAL}66; box-shadow:0 4px 14px rgba(22,40,47,.07); }
      .cc-nome { font-size:14.5px; font-weight:600; color:${TINTA}; margin-bottom:3px; }
      .cc-sub { font-size:12.5px; color:${SUAVE}; margin-bottom:13px; }
      .cc-rodape { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
      .pastilha { font-size:11.5px; color:${TEXTO}; background:${FUNDO}; border:1px solid ${LINHA};
        padding:3px 9px; border-radius:6px; }

      /* ----- Ficha ----- */
      .ficha { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:18px; padding:20px; }
      .rot { font-size:11px; color:${SUAVE}; text-transform:uppercase; letter-spacing:.4px; font-weight:600; }
      .chip-doc { background:${TEAL_FUNDO}; border:1px solid ${TEAL}33; color:${TEAL}; font-size:11.5px;
        padding:3px 8px; border-radius:6px; cursor:pointer; font-family:inherit; margin:0 4px 4px 0; }
      .chip-doc:hover { background:${TEAL}22; }
      .chip-anexar { background:none; border:1px dashed #C8D4D8; color:${SUAVE}; font-size:11.5px;
        padding:3px 8px; border-radius:6px; cursor:pointer; font-family:inherit; }
      .chip-anexar:hover { border-color:${TEAL}; color:${TEAL}; }
      .lista-docs { list-style:none; margin:0; padding:0; }
      .lista-docs li { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid ${LINHA}; }
      .lista-docs li:last-child { border-bottom:none; }
      .lista-docs .meta { margin-left:auto; font-size:12px; color:${SUAVE}; }

      /* ----- Login ----- */
      .login { min-height:100vh; display:grid; place-items:center; padding:24px;
        background:linear-gradient(180deg, ${TEAL_FUNDO} 0%, ${FUNDO} 45%); }
      .login-caixa { background:${BRANCO}; border:1px solid ${LINHA}; border-radius:14px;
        padding:36px 34px; width:400px; max-width:100%; box-shadow:0 10px 36px rgba(22,40,47,.07); }

      /* ----- Celular ----- */
      .btn-menu { display:none; background:${BRANCO}; border:1px solid ${LINHA}; color:${TEXTO};
        width:38px; height:38px; border-radius:8px; font-size:16px; cursor:pointer; flex-shrink:0; }
      .sombra-menu { display:none; position:fixed; inset:0; background:rgba(22,40,47,.3); z-index:70; }
      @media (max-width: 880px) {
        .lateral { position:fixed; left:0; top:0; z-index:75; transform:translateX(-100%);
          transition:transform .22s ease; box-shadow:0 0 40px rgba(22,40,47,.18); }
        .lateral.aberta { transform:translateX(0); }
        .sombra-menu { display:block; }
        .btn-menu { display:block; }
        .topo { padding:14px 16px; }
        .principal { padding:18px 16px 40px; }
        .duas-colunas { grid-template-columns:1fr; }
        .barra-acoes { flex-direction:column; align-items:stretch; }
        .filtros > * { width:100% !important; }
        .barra-acoes > input { width:100% !important; }
        table { min-width:720px; }
        .indicadores { grid-template-columns:1fr 1fr; gap:12px; }
      }
    `);
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
